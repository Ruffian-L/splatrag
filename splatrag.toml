data_dir = "data"
scope_key = "splatrag-main"

# Local HNSW + Tantivy carry retrieval on their own. Qdrant on :6360 is not running; re-enable it
# only when joining this store to the ~37k memories already embedded in that 4096-d collection.
[qdrant]
url = "http://127.0.0.1:6360"
collection = "export-conversations"
enabled = false

[embedding]
url = "http://127.0.0.1:8081"
model = "Qwen3-Embedding-8B-Q8_0.gguf"
dimensions = 4096
batch_size = 32
timeout_seconds = 180

[labeling]
url = "http://127.0.0.1:8082"
model = "gemma-4-12b-it-Q4_K_M.gguf"
enabled = true
timeout_seconds = 180

[retrieval]
weight_cosine = 10.0
weight_bm25 = 1.0
weight_radiance = 5.0
candidate_multiplier = 8
hnsw_max_nodes = 1000000
hnsw_m = 16
hnsw_ef_construction = 200
hnsw_ef_search = 80

[physics]
steps = 1200
dt = 0.02
damping = 0.9
origin_pull = 0.05
neighbor_radius = 2.0
attraction = 2.0
semantic_threshold = 0.55
repulsion_radius = 0.5
repulsion = 5.0
semantic_repulsion = 2.0
cross_domain_repulsion = 0.15
basin_radius = 0.8
min_basin_size = 3
spatial_cell_size = 1.0

[server]
# 8765 is occupied by the running niodoo service; do not take it.
bind = "127.0.0.1:8767"
