data_dir = "data"
scope_key = "splatrag-main"

# Local HNSW + Tantivy carry retrieval on their own. Qdrant on :6360 is not running; re-enable it
# only when joining this store to the ~37k memories already embedded in that 4096-d collection.
[qdrant]
url = "http://127.0.0.1:6360"
collection = "export-conversations"
enabled = false

[embedding]
url = "http://127.0.0.1:8081"
model = "Qwen3-Embedding-8B-Q8_0.gguf"
dimensions = 4096
batch_size = 32
timeout_seconds = 180

[labeling]
url = "http://127.0.0.1:8082"
model = "gemma-3-4b-it-q4_0.gguf"
enabled = true
timeout_seconds = 180

[retrieval]
weight_cosine = 10.0
weight_bm25 = 1.0
weight_radiance = 5.0
candidate_multiplier = 8
hnsw_max_nodes = 1000000
hnsw_m = 16
hnsw_ef_construction = 200
hnsw_ef_search = 80

[physics]
steps = 120
dt = 0.01600000075995922
damping = 0.9200000166893005
origin_pull = 0.0020000000949949026
neighbor_radius = 2.0
attraction = 0.019999999552965164
semantic_threshold = 0.550000011920929
repulsion_radius = 0.44999998807907104
repulsion = 0.11999999731779099
cross_domain_repulsion = 0.3499999940395355
basin_radius = 0.800000011920929
min_basin_size = 3
spatial_cell_size = 1.0

[server]
bind = "127.0.0.1:8765"
