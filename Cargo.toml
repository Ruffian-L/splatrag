[package]
name = "splatrag"
version = "0.1.0"
edition = "2024"
description = "Local Gaussian-splat AI memory store"
license = "MIT"

[workspace]
resolver = "2"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.7.9", features = ["json"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.4", features = ["derive", "env"] }
fast-hnsw = "1.0.1"
nalgebra = { version = "0.32.6", features = ["serde-serialize"] }
rayon = "1.12.0"
reqwest = { version = "0.12.28", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tantivy = "0.26.1"
tokio = { version = "1.53.1", features = ["full"] }
toml = "0.8.23"
tower-http = { version = "0.6.11", features = ["cors", "trace"] }
uuid = { version = "1.24.0", features = ["serde", "v5"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
