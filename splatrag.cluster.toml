# Acceptance-test config. Kept separate from splatrag.toml so SciFact and the poison corpus can
# never land in the personal memory scope — different data_dir AND different scope_key, because
# either one alone would still share the other's store.
data_dir = "data-cluster"
scope_key = "splatrag-clustertest"

[qdrant]
url = "http://127.0.0.1:6360"
collection = "handshake-scifact"
enabled = false

[embedding]
url = "http://127.0.0.1:8081"
model = "Qwen3-Embedding-8B-Q8_0.gguf"
dimensions = 4096
batch_size = 32
timeout_seconds = 600

# Basin labels are cosmetic and irrelevant to Recall@10/nDCG@10. Labeling every basin in a
# 5k-document corpus with a local 4B model would dominate the runtime and change no metric.
[labeling]
url = "http://127.0.0.1:8082"
model = "gemma-3-4b-it-q4_0.gguf"
enabled = true
timeout_seconds = 180

[retrieval]
weight_cosine = 10.0
weight_bm25 = 1.0
weight_radiance = 5.0
candidate_multiplier = 8
hnsw_max_nodes = 1000000
hnsw_m = 16
hnsw_ef_construction = 200
hnsw_ef_search = 80

[physics]
steps = 1200
dt = 0.02
damping = 0.9
origin_pull = 0.05
neighbor_radius = 2.0
attraction = 2.0
semantic_threshold = 0.55
repulsion_radius = 0.5
repulsion = 5.0
semantic_repulsion = 2.0
cross_domain_repulsion = 0.15
basin_radius = 0.8
min_basin_size = 3
spatial_cell_size = 1.0

[server]
bind = "127.0.0.1:8766"
